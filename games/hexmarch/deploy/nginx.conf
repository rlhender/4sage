# For those who already run nginx. Put this in /etc/nginx/sites-available/,
# link it into sites-enabled/, and get a certificate with certbot.
# Replace the name with your own domain.

server {
    listen 80;
    server_name hexmarch.example.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The browser game uses a WebSocket.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # AI players hold a request open for up to 55 seconds waiting for
        # their move, and a WebSocket stays open for a whole game.
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
